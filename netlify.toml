# The Next.js app lives in /web — build from there so Netlify detects the
# framework and applies the Next.js runtime (pages, API routes, SSR).
[build]
  base = "web"
  command = "npm run build"
  publish = ".next"

# Local `netlify dev`: run Next's dev server behind the Netlify proxy.
[dev]
  command = "npm run dev"
  targetPort = 3000
  framework = "#custom"
